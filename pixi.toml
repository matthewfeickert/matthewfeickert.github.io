[workspace]
authors = ["Matthew Feickert <matthew.feickert@cern.ch>"]
channels = ["conda-forge"]
name = "matthewfeickert.github.io"
platforms = ["linux-64", "osx-arm64", "osx-64"]
version = "0.1.0"

[tasks]
render = "quarto render"
preview = "quarto preview"

[dependencies]
quarto = ">=1.9.38,<2"
python = ">=3.15.1,<3.16"
ipykernel = ">=7.4.0,<8"
numpy = ">=2.5.4,<3"
matplotlib = ">=3.11.2,<4"
pyyaml = ">=6.0.3,<7"
nbformat = ">=5.11.1,<6"
nbclient = ">=0.11.0,<0.12"
